<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 2: HTML Advanced — Quiz</title>
<style>
  :root {
    --bg: #f7f7fb;
    --card: #ffffff;
    --ink: #1c1c28;
    --muted: #6b6b7b;
    --accent: #2457D6;
    --good: #1a8a4a;
    --bad: #d6403f;
    --border: #e3e3ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .desc { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qnum { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .prompt { font-weight: 600; margin-bottom: 14px; font-size: 1.05rem; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafafe;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--ink);
  }
  .option:hover { border-color: var(--accent); }
  .option.correct { background: #e6f6ec; border-color: var(--good); }
  .option.incorrect { background: #fbe9e9; border-color: var(--bad); }
  .option[disabled] { cursor: default; }
  .explanation {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    background: #f0f3fb;
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .explanation.show { display: block; }
  .verdict { font-weight: 700; }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  #score-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    font-weight: 600;
    margin-bottom: 8px;
  }
  #result {
    display: none;
    text-align: center;
    padding: 24px;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-top: 20px;
  }
  #result.show { display: block; }
  #result .big { font-size: 2rem; font-weight: 700; margin-bottom: 6px; }
  button.reset {
    margin-top: 14px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <p><a class="back" href="index.html">&larr; All quizzes</a></p>
  <h1>Week 2: HTML Advanced</h1>
  <p class="desc">Tables, forms/inputs/buttons, lists/links/images, semantic tags, div vs span, and GitHub Pages publishing.</p>
  <div id="score-bar">Score: <span id="score">0</span> / 8</div>
  <div id="questions"></div>
  <div id="result">
    <div class="big" id="final-score"></div>
    <div id="final-msg"></div>
    <button class="reset" onclick="location.reload()">Try again</button>
  </div>
</div>

<script>
const QUIZ = {"title": "Week 2: HTML Advanced", "description": "Tables, forms/inputs/buttons, lists/links/images, semantic tags, div vs span, and GitHub Pages publishing.", "questions": [{"prompt": "Which tag defines a table HEADER cell?", "options": [{"id": "a", "text": "<td>"}, {"id": "b", "text": "<tr>"}, {"id": "c", "text": "<th>"}, {"id": "d", "text": "<table>"}], "correct_option_id": "c", "explanation": "<th> stands for table header; <tr> is a table row, and <td> is a regular data cell."}, {"prompt": "What does the 'colspan' attribute on a <td> do?", "options": [{"id": "a", "text": "Colors the cell background"}, {"id": "b", "text": "Makes the cell span multiple columns"}, {"id": "c", "text": "Sorts the column alphabetically"}, {"id": "d", "text": "Hides the column"}], "correct_option_id": "b", "explanation": "colspan=\"2\" makes a cell stretch across 2 columns, useful for totals rows, for example."}, {"prompt": "Which input type would you use for a password field?", "options": [{"id": "a", "text": "type=\"text\""}, {"id": "b", "text": "type=\"hidden\""}, {"id": "c", "text": "type=\"password\""}, {"id": "d", "text": "type=\"secure\""}], "correct_option_id": "c", "explanation": "type=\"password\" masks the characters the user types."}, {"prompt": "What is the purpose of the <label> tag in a form?", "options": [{"id": "a", "text": "It submits the form"}, {"id": "b", "text": "It defines a caption for a form control, improving accessibility"}, {"id": "c", "text": "It validates the input"}, {"id": "d", "text": "It styles the form with CSS"}], "correct_option_id": "b", "explanation": "<label> gives a form control a readable caption and improves accessibility (e.g. clicking the label focuses the input)."}, {"prompt": "Which list type produces NUMBERED items?", "options": [{"id": "a", "text": "<ul>"}, {"id": "b", "text": "<ol>"}, {"id": "c", "text": "<li>"}, {"id": "d", "text": "<dl>"}], "correct_option_id": "b", "explanation": "<ol> is an ordered (numbered) list; <ul> is unordered (bulleted); <li> is a list item inside either."}, {"prompt": "Which of these is a SEMANTIC tag (as opposed to a generic container)?", "options": [{"id": "a", "text": "<div>"}, {"id": "b", "text": "<span>"}, {"id": "c", "text": "<nav>"}, {"id": "d", "text": "<br>"}], "correct_option_id": "c", "explanation": "<nav> clearly describes its meaning (navigation links) to both browser and developer, unlike the generic <div>/<span>."}, {"prompt": "What is the key difference between <div> and <span>?", "options": [{"id": "a", "text": "<div> is inline, <span> is block-level"}, {"id": "b", "text": "<div> is block-level (full width, new line), <span> is inline (stays in the text flow)"}, {"id": "c", "text": "There is no difference"}, {"id": "d", "text": "<span> can only be used inside <table>"}], "correct_option_id": "b", "explanation": "<div> is a block container that takes full width and starts on a new line; <span> is inline and only takes the width it needs."}, {"prompt": "To publish a site with GitHub Pages, what must the main HTML file be named?", "options": [{"id": "a", "text": "main.html"}, {"id": "b", "text": "home.html"}, {"id": "c", "text": "index.html"}, {"id": "d", "text": "default.html"}], "correct_option_id": "c", "explanation": "GitHub Pages looks for index.html as the entry point of the published site."}]};

let score = 0;
let answered = 0;
const container = document.getElementById('questions');
const scoreEl = document.getElementById('score');

QUIZ.questions.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  qnum.textContent = 'Question ' + (qi + 1) + ' of ' + QUIZ.questions.length;
  card.appendChild(qnum);

  const prompt = document.createElement('div');
  prompt.className = 'prompt';
  prompt.textContent = q.prompt;
  card.appendChild(prompt);

  const explanation = document.createElement('div');
  explanation.className = 'explanation';
  explanation.innerHTML = '<span class="verdict"></span><br>' + q.explanation;

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const buttons = card.querySelectorAll('.option');
      buttons.forEach(b => b.disabled = true);

      const correct = opt.id === q.correct_option_id;
      const verdictEl = explanation.querySelector('.verdict');
      if (correct) {
        btn.classList.add('correct');
        verdictEl.textContent = "Correct!";
        verdictEl.className = 'verdict good';
        score++;
      } else {
        btn.classList.add('incorrect');
        verdictEl.textContent = "Not quite.";
        verdictEl.className = 'verdict bad';
        buttons.forEach(b => {
          if (b.textContent === q.options.find(o => o.id === q.correct_option_id).text) {
            b.classList.add('correct');
          }
        });
      }
      explanation.classList.add('show');
      answered++;
      scoreEl.textContent = score;

      if (answered === QUIZ.questions.length) {
        showResult();
      }
    });
    card.appendChild(btn);
  });

  card.appendChild(explanation);
  container.appendChild(card);
});

function showResult() {
  const resultEl = document.getElementById('result');
  const total = QUIZ.questions.length;
  document.getElementById('final-score').textContent = score + ' / ' + total;
  let msg = '';
  const pct = score / total;
  if (pct === 1) msg = 'Perfect score!';
  else if (pct >= 0.7) msg = 'Great job!';
  else if (pct >= 0.4) msg = 'Good effort — review the topics you missed.';
  else msg = 'Worth another pass through the notes.';
  document.getElementById('final-msg').textContent = msg;
  resultEl.classList.add('show');
  resultEl.scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
