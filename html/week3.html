<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 3: CSS Fundamentals — Quiz</title>
<style>
  :root {
    --bg: #f7f7fb;
    --card: #ffffff;
    --ink: #1c1c28;
    --muted: #6b6b7b;
    --accent: #2457D6;
    --good: #1a8a4a;
    --bad: #d6403f;
    --border: #e3e3ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .desc { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qnum { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .prompt { font-weight: 600; margin-bottom: 14px; font-size: 1.05rem; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafafe;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--ink);
  }
  .option:hover { border-color: var(--accent); }
  .option.correct { background: #e6f6ec; border-color: var(--good); }
  .option.incorrect { background: #fbe9e9; border-color: var(--bad); }
  .option[disabled] { cursor: default; }
  .explanation {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    background: #f0f3fb;
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .explanation.show { display: block; }
  .verdict { font-weight: 700; }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  #score-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    font-weight: 600;
    margin-bottom: 8px;
  }
  #result {
    display: none;
    text-align: center;
    padding: 24px;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-top: 20px;
  }
  #result.show { display: block; }
  #result .big { font-size: 2rem; font-weight: 700; margin-bottom: 6px; }
  button.reset {
    margin-top: 14px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <p><a class="back" href="index.html">&larr; All quizzes</a></p>
  <h1>Week 3: CSS Fundamentals</h1>
  <p class="desc">Adding CSS, selectors &amp; specificity, colors, fonts, the box model, positioning, float/clear, interactive states, and validation.</p>
  <div id="score-bar">Score: <span id="score">0</span> / 10</div>
  <div id="questions"></div>
  <div id="result">
    <div class="big" id="final-score"></div>
    <div id="final-msg"></div>
    <button class="reset" onclick="location.reload()">Try again</button>
  </div>
</div>

<script>
const QUIZ = {"title": "Week 3: CSS Fundamentals", "description": "Adding CSS, selectors & specificity, colors, fonts, the box model, positioning, float/clear, interactive states, and validation.", "questions": [{"prompt": "Which way of adding CSS allows the same styles to be reused across multiple pages?", "options": [{"id": "a", "text": "Inline CSS"}, {"id": "b", "text": "Internal CSS"}, {"id": "c", "text": "External CSS"}, {"id": "d", "text": "JavaScript-injected CSS"}], "correct_option_id": "c", "explanation": "An external .css file linked with <link rel=\"stylesheet\"> can be reused across many pages."}, {"prompt": "Given the CSS selectors p, .card, and #title targeting the same element, which one wins?", "options": [{"id": "a", "text": "p (element selector)"}, {"id": "b", "text": ".card (class selector)"}, {"id": "c", "text": "#title (ID selector)"}, {"id": "d", "text": "They all apply equally, last one in the file wins"}], "correct_option_id": "c", "explanation": "ID selectors are the most specific, followed by class, then element selectors."}, {"prompt": "If two CSS rules have EQUAL specificity, which one applies?", "options": [{"id": "a", "text": "The one declared first"}, {"id": "b", "text": "The one declared later"}, {"id": "c", "text": "Neither applies"}, {"id": "d", "text": "The browser picks randomly"}], "correct_option_id": "b", "explanation": "When specificity is tied, the cascade favors the later declaration in the stylesheet."}, {"prompt": "Which CSS properties typically DO NOT inherit from parent to child?", "options": [{"id": "a", "text": "color and font-family"}, {"id": "b", "text": "margin and border"}, {"id": "c", "text": "text-align and font-size"}, {"id": "d", "text": "All properties inherit"}], "correct_option_id": "b", "explanation": "Color and font properties usually inherit; margin and border do not."}, {"prompt": "Which CSS color notation is this: rgba(255, 0, 0, 0.5)?", "options": [{"id": "a", "text": "HEX"}, {"id": "b", "text": "HSL"}, {"id": "c", "text": "RGBA (with alpha/transparency)"}, {"id": "d", "text": "A named color"}], "correct_option_id": "c", "explanation": "rgba() specifies red, green, blue plus an alpha (transparency) value between 0 and 1."}, {"prompt": "In the CSS box model, listed from innermost to outermost, what is the correct order?", "options": [{"id": "a", "text": "margin → border → padding → content"}, {"id": "b", "text": "content → padding → border → margin"}, {"id": "c", "text": "content → border → padding → margin"}, {"id": "d", "text": "padding → content → margin → border"}], "correct_option_id": "b", "explanation": "From the inside out: content, then padding (space inside the border), then border, then margin (space outside the border)."}, {"prompt": "Which 'position' value keeps an element fixed relative to the browser viewport, even when scrolling?", "options": [{"id": "a", "text": "static"}, {"id": "b", "text": "relative"}, {"id": "c", "text": "absolute"}, {"id": "d", "text": "fixed"}], "correct_option_id": "d", "explanation": "position: fixed keeps the element anchored to the viewport regardless of page scroll."}, {"prompt": "What does 'clear: both;' do to an element?", "options": [{"id": "a", "text": "Removes all its CSS styles"}, {"id": "b", "text": "Places it below floated elements on both sides"}, {"id": "c", "text": "Makes it transparent"}, {"id": "d", "text": "Floats it to both left and right simultaneously"}], "correct_option_id": "b", "explanation": "clear: both prevents the element from sitting beside floats on either side, pushing it below them."}, {"prompt": "Which pseudo-class applies while the mouse pointer is over an element?", "options": [{"id": "a", "text": ":focus"}, {"id": "b", "text": ":hover"}, {"id": "c", "text": ":active"}, {"id": "d", "text": ":visited"}], "correct_option_id": "b", "explanation": ":hover applies while the pointer is over the element; :focus applies to keyboard-focused elements like form inputs."}, {"prompt": "What does the 'rem' sizing unit refer to?", "options": [{"id": "a", "text": "A fixed pixel size"}, {"id": "b", "text": "Relative to the parent element's font size"}, {"id": "c", "text": "Relative to the root element's font size"}, {"id": "d", "text": "Relative to the viewport width"}], "correct_option_id": "c", "explanation": "'rem' (root em) is relative to the font size of the root (<html>) element, unlike 'em' which is relative to the parent."}]};

let score = 0;
let answered = 0;
const container = document.getElementById('questions');
const scoreEl = document.getElementById('score');

QUIZ.questions.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  qnum.textContent = 'Question ' + (qi + 1) + ' of ' + QUIZ.questions.length;
  card.appendChild(qnum);

  const prompt = document.createElement('div');
  prompt.className = 'prompt';
  prompt.textContent = q.prompt;
  card.appendChild(prompt);

  const explanation = document.createElement('div');
  explanation.className = 'explanation';
  explanation.innerHTML = '<span class="verdict"></span><br>' + q.explanation;

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const buttons = card.querySelectorAll('.option');
      buttons.forEach(b => b.disabled = true);

      const correct = opt.id === q.correct_option_id;
      const verdictEl = explanation.querySelector('.verdict');
      if (correct) {
        btn.classList.add('correct');
        verdictEl.textContent = "Correct!";
        verdictEl.className = 'verdict good';
        score++;
      } else {
        btn.classList.add('incorrect');
        verdictEl.textContent = "Not quite.";
        verdictEl.className = 'verdict bad';
        buttons.forEach(b => {
          if (b.textContent === q.options.find(o => o.id === q.correct_option_id).text) {
            b.classList.add('correct');
          }
        });
      }
      explanation.classList.add('show');
      answered++;
      scoreEl.textContent = score;

      if (answered === QUIZ.questions.length) {
        showResult();
      }
    });
    card.appendChild(btn);
  });

  card.appendChild(explanation);
  container.appendChild(card);
});

function showResult() {
  const resultEl = document.getElementById('result');
  const total = QUIZ.questions.length;
  document.getElementById('final-score').textContent = score + ' / ' + total;
  let msg = '';
  const pct = score / total;
  if (pct === 1) msg = 'Perfect score!';
  else if (pct >= 0.7) msg = 'Great job!';
  else if (pct >= 0.4) msg = 'Good effort — review the topics you missed.';
  else msg = 'Worth another pass through the notes.';
  document.getElementById('final-msg').textContent = msg;
  resultEl.classList.add('show');
  resultEl.scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
