<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 4: CSS Layouts — Flexbox &amp; Grid — Quiz</title>
<style>
  :root {
    --bg: #f7f7fb;
    --card: #ffffff;
    --ink: #1c1c28;
    --muted: #6b6b7b;
    --accent: #2457D6;
    --good: #1a8a4a;
    --bad: #d6403f;
    --border: #e3e3ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .desc { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qnum { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .prompt { font-weight: 600; margin-bottom: 14px; font-size: 1.05rem; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafafe;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--ink);
  }
  .option:hover { border-color: var(--accent); }
  .option.correct { background: #e6f6ec; border-color: var(--good); }
  .option.incorrect { background: #fbe9e9; border-color: var(--bad); }
  .option[disabled] { cursor: default; }
  .explanation {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    background: #f0f3fb;
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .explanation.show { display: block; }
  .verdict { font-weight: 700; }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  #score-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    font-weight: 600;
    margin-bottom: 8px;
  }
  #result {
    display: none;
    text-align: center;
    padding: 24px;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-top: 20px;
  }
  #result.show { display: block; }
  #result .big { font-size: 2rem; font-weight: 700; margin-bottom: 6px; }
  button.reset {
    margin-top: 14px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <p><a class="back" href="index.html">&larr; All quizzes</a></p>
  <h1>Week 4: CSS Layouts — Flexbox &amp; Grid</h1>
  <p class="desc">The display property, display:none vs visibility:hidden, Flexbox terminology/properties, Grid terminology/properties, and when to use each.</p>
  <div id="score-bar">Score: <span id="score">0</span> / 10</div>
  <div id="questions"></div>
  <div id="result">
    <div class="big" id="final-score"></div>
    <div id="final-msg"></div>
    <button class="reset" onclick="location.reload()">Try again</button>
  </div>
</div>

<script>
const QUIZ = {"title": "Week 4: CSS Layouts — Flexbox & Grid", "description": "The display property, display:none vs visibility:hidden, Flexbox terminology/properties, Grid terminology/properties, and when to use each.", "questions": [{"prompt": "What is the key difference between 'display: none' and 'visibility: hidden'?", "options": [{"id": "a", "text": "They behave identically"}, {"id": "b", "text": "display: none removes the element and its space; visibility: hidden hides it but keeps its space"}, {"id": "c", "text": "visibility: hidden removes the element from the DOM entirely"}, {"id": "d", "text": "display: none only works on images"}], "correct_option_id": "b", "explanation": "display: none takes the element out of the layout completely (no space reserved); visibility: hidden hides it visually but its space remains."}, {"prompt": "Which CSS property turns an element into a flex container?", "options": [{"id": "a", "text": "display: block"}, {"id": "b", "text": "display: flex"}, {"id": "c", "text": "position: flex"}, {"id": "d", "text": "flex: container"}], "correct_option_id": "b", "explanation": "display: flex (or inline-flex) turns the element into a flex container for its direct children."}, {"prompt": "Is Flexbox a one-dimensional or two-dimensional layout system?", "options": [{"id": "a", "text": "One-dimensional (row OR column)"}, {"id": "b", "text": "Two-dimensional (rows AND columns)"}, {"id": "c", "text": "Three-dimensional"}, {"id": "d", "text": "It has no dimensionality"}], "correct_option_id": "a", "explanation": "Flexbox arranges items along a single axis (row or column) at a time — it's one-dimensional, unlike Grid."}, {"prompt": "In a flex container with flex-direction: row, which axis is the MAIN axis?", "options": [{"id": "a", "text": "Vertical"}, {"id": "b", "text": "Horizontal"}, {"id": "c", "text": "Diagonal"}, {"id": "d", "text": "There is no main axis in row mode"}], "correct_option_id": "b", "explanation": "With flex-direction: row, the main axis runs horizontally; the cross axis is vertical."}, {"prompt": "Which property aligns flex items along the MAIN axis?", "options": [{"id": "a", "text": "align-items"}, {"id": "b", "text": "justify-content"}, {"id": "c", "text": "align-self"}, {"id": "d", "text": "flex-wrap"}], "correct_option_id": "b", "explanation": "justify-content aligns items on the main axis (e.g. flex-start, center, space-between); align-items handles the cross axis."}, {"prompt": "What does 'flex: 1;' on every child of a flex container achieve?", "options": [{"id": "a", "text": "Only the first child grows"}, {"id": "b", "text": "Each item takes an equal share of the available space"}, {"id": "c", "text": "All items shrink to zero width"}, {"id": "d", "text": "It disables flexbox for those items"}], "correct_option_id": "b", "explanation": "flex: 1 is shorthand that lets each item grow equally to fill the available space."}, {"prompt": "Which CSS Grid unit represents 'a fraction of the available space in the container'?", "options": [{"id": "a", "text": "px"}, {"id": "b", "text": "%"}, {"id": "c", "text": "fr"}, {"id": "d", "text": "em"}], "correct_option_id": "c", "explanation": "The fr unit (e.g. grid-template-columns: 1fr 2fr) distributes available space proportionally between tracks."}, {"prompt": "What does 'grid-column: span 2;' do to a grid item?", "options": [{"id": "a", "text": "Moves the item to column 2"}, {"id": "b", "text": "Makes the item occupy 2 columns"}, {"id": "c", "text": "Deletes column 2"}, {"id": "d", "text": "Hides the item in column 2"}], "correct_option_id": "b", "explanation": "span 2 makes the grid item stretch across 2 columns starting from its placement."}, {"prompt": "Which CSS Grid property lets you lay out a page using named regions like 'header', 'sidebar', 'main', 'footer'?", "options": [{"id": "a", "text": "grid-template-areas"}, {"id": "b", "text": "grid-gap"}, {"id": "c", "text": "justify-items"}, {"id": "d", "text": "flex-flow"}], "correct_option_id": "a", "explanation": "grid-template-areas lets you define a readable text map of named regions, then assign each item to one via grid-area."}, {"prompt": "Which layout system would you choose for a full, complex page layout with both rows and columns (e.g. a dashboard)?", "options": [{"id": "a", "text": "Flexbox, because it's one-dimensional"}, {"id": "b", "text": "CSS Grid, because it's two-dimensional"}, {"id": "c", "text": "Neither — use only floats"}, {"id": "d", "text": "Neither — use only positioning"}], "correct_option_id": "b", "explanation": "Grid is built for two-dimensional, layout-first designs like dashboards; Flexbox suits simpler, one-direction content like navbars."}]};

let score = 0;
let answered = 0;
const container = document.getElementById('questions');
const scoreEl = document.getElementById('score');

QUIZ.questions.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  qnum.textContent = 'Question ' + (qi + 1) + ' of ' + QUIZ.questions.length;
  card.appendChild(qnum);

  const prompt = document.createElement('div');
  prompt.className = 'prompt';
  prompt.textContent = q.prompt;
  card.appendChild(prompt);

  const explanation = document.createElement('div');
  explanation.className = 'explanation';
  explanation.innerHTML = '<span class="verdict"></span><br>' + q.explanation;

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const buttons = card.querySelectorAll('.option');
      buttons.forEach(b => b.disabled = true);

      const correct = opt.id === q.correct_option_id;
      const verdictEl = explanation.querySelector('.verdict');
      if (correct) {
        btn.classList.add('correct');
        verdictEl.textContent = "Correct!";
        verdictEl.className = 'verdict good';
        score++;
      } else {
        btn.classList.add('incorrect');
        verdictEl.textContent = "Not quite.";
        verdictEl.className = 'verdict bad';
        buttons.forEach(b => {
          if (b.textContent === q.options.find(o => o.id === q.correct_option_id).text) {
            b.classList.add('correct');
          }
        });
      }
      explanation.classList.add('show');
      answered++;
      scoreEl.textContent = score;

      if (answered === QUIZ.questions.length) {
        showResult();
      }
    });
    card.appendChild(btn);
  });

  card.appendChild(explanation);
  container.appendChild(card);
});

function showResult() {
  const resultEl = document.getElementById('result');
  const total = QUIZ.questions.length;
  document.getElementById('final-score').textContent = score + ' / ' + total;
  let msg = '';
  const pct = score / total;
  if (pct === 1) msg = 'Perfect score!';
  else if (pct >= 0.7) msg = 'Great job!';
  else if (pct >= 0.4) msg = 'Good effort — review the topics you missed.';
  else msg = 'Worth another pass through the notes.';
  document.getElementById('final-msg').textContent = msg;
  resultEl.classList.add('show');
  resultEl.scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
