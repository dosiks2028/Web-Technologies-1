<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 1: Introduction to Web Technologies — Quiz</title>
<style>
  :root {
    --bg: #f7f7fb;
    --card: #ffffff;
    --ink: #1c1c28;
    --muted: #6b6b7b;
    --accent: #2457D6;
    --good: #1a8a4a;
    --bad: #d6403f;
    --border: #e3e3ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .desc { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qnum { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .prompt { font-weight: 600; margin-bottom: 14px; font-size: 1.05rem; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafafe;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--ink);
  }
  .option:hover { border-color: var(--accent); }
  .option.correct { background: #e6f6ec; border-color: var(--good); }
  .option.incorrect { background: #fbe9e9; border-color: var(--bad); }
  .option[disabled] { cursor: default; }
  .explanation {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    background: #f0f3fb;
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .explanation.show { display: block; }
  .verdict { font-weight: 700; }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  #score-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    font-weight: 600;
    margin-bottom: 8px;
  }
  #result {
    display: none;
    text-align: center;
    padding: 24px;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-top: 20px;
  }
  #result.show { display: block; }
  #result .big { font-size: 2rem; font-weight: 700; margin-bottom: 6px; }
  button.reset {
    margin-top: 14px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <p><a class="back" href="index.html">&larr; All quizzes</a></p>
  <h1>Week 1: Introduction to Web Technologies</h1>
  <p class="desc">Internet &amp; WWW basics, client-server model, front-end vs back-end, and the basics of HTML.</p>
  <div id="score-bar">Score: <span id="score">0</span> / 8</div>
  <div id="questions"></div>
  <div id="result">
    <div class="big" id="final-score"></div>
    <div id="final-msg"></div>
    <button class="reset" onclick="location.reload()">Try again</button>
  </div>
</div>

<script>
const QUIZ = {"title": "Week 1: Introduction to Web Technologies", "description": "Internet & WWW basics, client-server model, front-end vs back-end, and the basics of HTML.", "questions": [{"prompt": "In the client-server model, what role does the browser play?", "options": [{"id": "a", "text": "Server — it responds with the web page"}, {"id": "b", "text": "Client — it sends a request to the server"}, {"id": "c", "text": "Router — it forwards packets between networks"}, {"id": "d", "text": "ISP — it provides the internet connection"}], "correct_option_id": "b", "explanation": "The browser is the client: it sends a request (e.g., HTTP) and the web server responds with the page."}, {"prompt": "Which technology is responsible for how a webpage LOOKS?", "options": [{"id": "a", "text": "HTML"}, {"id": "b", "text": "CSS"}, {"id": "c", "text": "JavaScript"}, {"id": "d", "text": "HTTP"}], "correct_option_id": "b", "explanation": "CSS handles presentation (how the page looks); HTML handles structure; JavaScript handles behavior."}, {"prompt": "What does HTML stand for?", "options": [{"id": "a", "text": "HyperText Markup Language"}, {"id": "b", "text": "High-Text Machine Language"}, {"id": "c", "text": "HyperTransfer Markup Language"}, {"id": "d", "text": "Home Tool Markup Language"}], "correct_option_id": "a", "explanation": "HTML = HyperText Markup Language, the standard markup language for building web pages."}, {"prompt": "Which part of an HTML document is NOT visible on the rendered page?", "options": [{"id": "a", "text": "<body>"}, {"id": "b", "text": "<head>"}, {"id": "c", "text": "<h1>"}, {"id": "d", "text": "<p>"}], "correct_option_id": "b", "explanation": "<head> holds metadata (title, charset, etc.) for the browser; it's not displayed on the page itself."}, {"prompt": "Which tag inserts a single line break without a closing tag?", "options": [{"id": "a", "text": "<hr>"}, {"id": "b", "text": "<br>"}, {"id": "c", "text": "<lb>"}, {"id": "d", "text": "<p>"}], "correct_option_id": "b", "explanation": "<br> inserts a single line break and, like <hr>, has no closing tag."}, {"prompt": "In <a href=\"example.com\">Visit</a>, what is 'href' called?", "options": [{"id": "a", "text": "A tag"}, {"id": "b", "text": "An attribute"}, {"id": "c", "text": "An element"}, {"id": "d", "text": "A selector"}], "correct_option_id": "b", "explanation": "Attributes provide extra information about an element and are always specified in the start tag as name=\"value\" pairs."}, {"prompt": "Which heading tag represents the MOST important heading on a page?", "options": [{"id": "a", "text": "<h6>"}, {"id": "b", "text": "<h1>"}, {"id": "c", "text": "<h3>"}, {"id": "d", "text": "<head>"}], "correct_option_id": "b", "explanation": "<h1> is the highest-level, most important heading; <h6> is the least important."}, {"prompt": "Which tool would you primarily use to inspect a page's HTML/CSS and read console errors while developing?", "options": [{"id": "a", "text": "GitHub"}, {"id": "b", "text": "Browser Developer Tools"}, {"id": "c", "text": "Git"}, {"id": "d", "text": "NetAcad"}], "correct_option_id": "b", "explanation": "Browser Developer Tools let you inspect HTML/CSS, read console errors, and test responsive behavior."}]};

let score = 0;
let answered = 0;
const container = document.getElementById('questions');
const scoreEl = document.getElementById('score');

QUIZ.questions.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  qnum.textContent = 'Question ' + (qi + 1) + ' of ' + QUIZ.questions.length;
  card.appendChild(qnum);

  const prompt = document.createElement('div');
  prompt.className = 'prompt';
  prompt.textContent = q.prompt;
  card.appendChild(prompt);

  const explanation = document.createElement('div');
  explanation.className = 'explanation';
  explanation.innerHTML = '<span class="verdict"></span><br>' + q.explanation;

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.type = 'button';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const buttons = card.querySelectorAll('.option');
      buttons.forEach(b => b.disabled = true);

      const correct = opt.id === q.correct_option_id;
      const verdictEl = explanation.querySelector('.verdict');
      if (correct) {
        btn.classList.add('correct');
        verdictEl.textContent = "Correct!";
        verdictEl.className = 'verdict good';
        score++;
      } else {
        btn.classList.add('incorrect');
        verdictEl.textContent = "Not quite.";
        verdictEl.className = 'verdict bad';
        buttons.forEach(b => {
          if (b.textContent === q.options.find(o => o.id === q.correct_option_id).text) {
            b.classList.add('correct');
          }
        });
      }
      explanation.classList.add('show');
      answered++;
      scoreEl.textContent = score;

      if (answered === QUIZ.questions.length) {
        showResult();
      }
    });
    card.appendChild(btn);
  });

  card.appendChild(explanation);
  container.appendChild(card);
});

function showResult() {
  const resultEl = document.getElementById('result');
  const total = QUIZ.questions.length;
  document.getElementById('final-score').textContent = score + ' / ' + total;
  let msg = '';
  const pct = score / total;
  if (pct === 1) msg = 'Perfect score!';
  else if (pct >= 0.7) msg = 'Great job!';
  else if (pct >= 0.4) msg = 'Good effort — review the topics you missed.';
  else msg = 'Worth another pass through the notes.';
  document.getElementById('final-msg').textContent = msg;
  resultEl.classList.add('show');
  resultEl.scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
